<!DOCTYPE html>
<html lang="es">
<head>
  <script src="assets/scripts/auth-guard.js?v=2"></script>
  <script>window.FaunaAuth.requireRole('investigador', true);</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar — FaunaScan</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/styles/verificar-detalle.css?v=6">
  <link rel="stylesheet" href="assets/styles/base.css?v=1">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar__header">
        <img src="assets/images/LogoFaunaScan.png" alt="Logo de FaunaScan" class="sidebar__logo-img">
        <span class="sidebar__logo-text">FaunaScan</span>
      </div>
      <nav class="sidebar__nav">
        <a href="dashboard.html" class="sidebar__link">
          <img src="assets/icons/Principal.png" class="sidebar__icon">Principal</a>
        <a href="registrar.html" class="sidebar__link">
          <img src="assets/icons/Registrar.png" class="sidebar__icon">Registrar</a>
        <a href="mapa.html" class="sidebar__link">
          <img src="assets/icons/Mapa.png" class="sidebar__icon">Mapa</a>
        <a href="reportes.html" class="sidebar__link">
          <img src="assets/icons/Reportes.png" class="sidebar__icon">Reportes</a>
        <a href="historial.html" class="sidebar__link">
          <img src="assets/icons/Historial.png" class="sidebar__icon">Historial</a>
      </nav>
    </aside>
    <div class="sidebar-overlay"></div>

    <main class="app-content">
      <div class="app-topbar">
        <button class="sidebar-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h1 class="app-topbar__title">Verificar</h1>
      </div>

      <p class="verdet-no-encontrado" id="verdetNoEncontrado" style="display:none;">
        No se encontró el avistamiento solicitado. <a href="verificar.html">Volver a la cola de validación</a>.
      </p>

      <div class="verdet-layout" id="verdetLayout">
        <div>
          <div class="verdet-foto" id="verdetFoto"></div>
          <h4 class="verdet-subtitulo"><span class="verdet-subtitulo__icon">📍</span> Ubicación</h4>
          <p class="verdet-zona" id="verdetZona"></p>
          <div class="verdet-mapa" id="verdetMapa"></div>
          <p class="verdet-no-encontrado" id="verdetSinCoords" style="display:none;">
            Este registro no incluye coordenadas.
          </p>
          <div class="verdet-coords" id="verdetCoords">
            <span>Lat: <strong id="verdetLat">—</strong></span>
            <span>Lng: <strong id="verdetLng">—</strong></span>
          </div>
        </div>

        <div>
          <div class="verdet-banner" id="verdetBanner">
            <div class="verdet-banner__foto" id="verdetBannerFoto">🐾</div>
            <div class="verdet-banner__info">
              <h2 class="verdet-banner__nombre" id="verdetNombre">—</h2>
              <p class="verdet-banner__cientifico" id="verdetCientifico"></p>
              <span class="badge badge-yellow" id="verdetEstado" style="display:none;"></span>
            </div>
          </div>

          <p class="verdet-autor" id="verdetAutor"></p>

          <h4 class="verdet-subtitulo"><span class="verdet-subtitulo__icon">📋</span> Observaciones</h4>
          <p class="verdet-observacion" id="verdetObservacion">Sin observaciones registradas.</p>

          <div class="verdet-chips" id="verdetChips"></div>

          <div class="verdet-metrics" id="verdetMetrics">
            <div class="form-group"><label class="form-label">TEMP °C</label><input class="form-input" type="text" id="verdetTemp" value="—" readonly></div>
            <div class="form-group"><label class="form-label">Humedad %</label><input class="form-input" type="text" id="verdetHumedad" value="—" readonly></div>
            <div class="form-group"><label class="form-label">N° de individuos</label><input class="form-input" type="text" id="verdetIndividuos" value="—" readonly></div>
          </div>

          <p class="verdet-resuelto" id="verdetResuelto" style="display:none;"></p>
          <div class="verdet-acciones" id="verdetAcciones">
            <button class="btn btn-primary btn-full mt-6" id="btnValidarDetalle">Validar</button>
            <button class="btn btn-outline btn-full mt-3" id="btnRechazarDetalle">Rechazar</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="assets/scripts/avistamientos-store.js?v=1" defer></script>
  <script src="assets/scripts/verificar-detalle.js?v=4" defer></script>
</body>
</html>
