<!DOCTYPE html>
<html lang="es">
<head>
  <script src="assets/scripts/auth-guard.js?v=2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificaciones — FaunaScan</title>
  <link rel="stylesheet" href="assets/styles/notificaciones.css?v=3">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar__header">
        <img src="assets/images/LogoFaunaScan.png" alt="FaunaScan" class="sidebar__logo-img">
        <span class="sidebar__logo-text">FaunaScan</span>
      </div>
      <nav class="sidebar__nav">
        <a href="dashboard.html" class="sidebar__link active">
          <img src="assets/icons/Principal.png" class="sidebar__icon">Principal</a>
        <a href="registrar.html" class="sidebar__link">
          <img src="assets/icons/Registrar.png" class="sidebar__icon">Registrar</a>
        <a href="mapa.html" class="sidebar__link">
          <img src="assets/icons/Mapa.png" class="sidebar__icon">Mapa</a>
        <a href="reportes.html" class="sidebar__link">
          <img src="assets/icons/Reportes.png" class="sidebar__icon">Reportes</a>
        <a href="historial.html" class="sidebar__link">
          <img src="assets/icons/Historial.png" class="sidebar__icon">Historial</a>
      </nav>
    </aside>
    <div class="sidebar-overlay"></div>

    <main class="app-content">
      <div class="app-topbar">
        <button class="sidebar-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h1 class="app-topbar__title">Notificaciones</h1>
        <div class="app-topbar__actions">
          <a href="configuracion-notificaciones.html" class="app-topbar__action"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.42.63.76 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Configurar</a>
        </div>
      </div>

      <div class="notif-summary">
        <div class="notif-summary-card notif-summary-card--red">
          <span class="notif-summary-card__num" id="countCriticas">0</span>
          <span class="notif-summary-card__label">Críticas</span>
        </div>
        <div class="notif-summary-card notif-summary-card--blue">
          <span class="notif-summary-card__num" id="countSistema">0</span>
          <span class="notif-summary-card__label">Sistema</span>
        </div>
        <div class="notif-summary-card notif-summary-card--yellow">
          <span class="notif-summary-card__num" id="countAlertas">0</span>
          <span class="notif-summary-card__label">Alertas</span>
        </div>
      </div>

      <div class="notif-filters">
        <button class="notif-filter notif-filter--active" data-filter="todas">Todas</button>
        <button class="notif-filter" data-filter="criticas">Críticas</button>
        <button class="notif-filter" data-filter="sistema">Sistema</button>
        <button class="notif-filter" data-filter="alertas">Alertas</button>
      </div>

      <div class="notif-list" id="notifList"></div>
      <p class="notif-empty" id="notifEmpty" style="display:none;">
        No tienes notificaciones todavía. Aparecerán aquí avistamientos críticos de la comunidad y validaciones de tus propios registros.
      </p>
    </main>
  </div>
  <script src="assets/scripts/avistamientos-store.js?v=1" defer></script>
  <script src="assets/scripts/notificaciones.js?v=5" defer></script>
</body>
</html>
