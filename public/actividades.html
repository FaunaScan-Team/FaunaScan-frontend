<!DOCTYPE html>
<html lang="es">
<head>
  <script src="assets/scripts/auth-guard.js?v=2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividades recientes — FaunaScan</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/styles/fonts.css?v=1">
  <link rel="stylesheet" href="assets/styles/actividades.css?v=7">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar__header">
        <img src="assets/images/LogoFaunaScan.png" alt="FaunaScan" class="sidebar__logo-img">
        <span class="sidebar__logo-text">FaunaScan</span>
      </div>
      <nav class="sidebar__nav">
        <a href="dashboard.html" class="sidebar__link active">
          <img src="assets/icons/Principal.png" class="sidebar__icon">Principal</a>
        <a href="registrar.html" class="sidebar__link">
          <img src="assets/icons/Registrar.png" class="sidebar__icon">Registrar</a>
        <a href="mapa.html" class="sidebar__link">
          <img src="assets/icons/Mapa.png" class="sidebar__icon">Mapa</a>
        <a href="reportes.html" class="sidebar__link">
          <img src="assets/icons/Reportes.png" class="sidebar__icon">Reportes</a>
        <a href="historial.html" class="sidebar__link">
          <img src="assets/icons/Historial.png" class="sidebar__icon">Historial</a>
      </nav>
    </aside>
    <div class="sidebar-overlay"></div>

    <main class="app-content">
      <div class="app-topbar">
        <button class="sidebar-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h1 class="app-topbar__title">Actividades Recientes</h1>
      </div>

      <div class="actividades-layout">
        <ul class="actividades-list" id="actividadesList"></ul>
        <p class="actividades-empty" id="actividadesEmpty" style="display:none;">
          Todavía no hay avistamientos registrados por la comunidad.
        </p>

        <div class="actividad-detalle card" id="actividadDetalle">
          <h3 class="card__title">Registro</h3>
          <h2 class="actividad-detalle__especie" id="detEspecie">—</h2>
          <div class="actividad-detalle__foto" id="detFoto"></div>
          <p class="actividad-detalle__texto" id="detTexto">—</p>
          <p class="actividad-detalle__lugar" id="detLugar"></p>
          <h4 class="actividad-detalle__subtitulo">Ubicación</h4>
          <div class="actividad-detalle__mapa" id="detMapa"></div>
          <p class="actividades-empty" id="detSinCoords" style="display:none;">
            Este registro no incluye coordenadas.
          </p>
          <div class="actividad-detalle__coords" id="detCoords">
            <span>Lat: <strong id="detLat">—</strong></span>
            <span>Lng: <strong id="detLng">—</strong></span>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="assets/scripts/avistamientos-store.js?v=1" defer></script>
  <script src="assets/scripts/actividades.js?v=6" defer></script>
</body>
</html>
