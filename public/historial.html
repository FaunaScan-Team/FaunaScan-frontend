<!DOCTYPE html>
<html lang="es">
<head>
  <script src="assets/scripts/auth-guard.js?v=2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial — FaunaScan</title>
  <link rel="stylesheet" href="assets/styles/fonts.css?v=1">
  <link rel="stylesheet" href="assets/styles/historial.css?v=5">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar__header">
        <img src="assets/images/LogoFaunaScan.png" alt="FaunaScan" class="sidebar__logo-img">        
        <span class="sidebar__logo-text">FaunaScan</span>
      </div>
      <nav class="sidebar__nav">
        <a href="dashboard.html" class="sidebar__link">
          <img src="assets/icons/Principal.png" class="sidebar__icon">Principal</a>
        <a href="registrar.html" class="sidebar__link">
          <img src="assets/icons/Registrar.png" class="sidebar__icon">Registrar</a>
        <a href="mapa.html" class="sidebar__link">
          <img src="assets/icons/Mapa.png" class="sidebar__icon">Mapa</a>
        <a href="reportes.html" class="sidebar__link">
          <img src="assets/icons/Reportes.png" class="sidebar__icon">Reportes</a>
        <a href="historial.html" class="sidebar__link">
          <img src="assets/icons/Historial.png" class="sidebar__icon">Historial</a>
      </nav>
    </aside>
    <div class="sidebar-overlay"></div>

    <main class="app-content">
      <div class="app-topbar">
        <button class="sidebar-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h1 class="app-topbar__title">Historial de registros</h1>
      </div>

      <div class="historial-layout">
        <aside class="historial-filters card">
          <h3 class="card__title">Filtros</h3>
          <div class="form-group">
            <label class="form-label">Animal</label>
            <input class="form-input" type="text" id="filtroAnimal" placeholder="Nombre de especie...">
          </div>
          <div class="form-group">
            <label class="form-label">Período</label>
            <select class="form-input" id="filtroPeriodo">
              <option value="">Este mes</option>
              <option value="trimestre">Último trimestre</option>
              <option value="anio">Este año</option>
              <option value="personalizado">Personalizado</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Desde</label>
              <input class="form-input" type="date" id="filtroDesde">
            </div>
            <div class="form-group">
              <label class="form-label">Hasta</label>
              <input class="form-input" type="date" id="filtroHasta">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Estado</label>
            <select class="form-input" id="filtroEstadoHistorial">
              <option value="">Todos</option>
              <option value="validado">Validado</option>
              <option value="pendiente">Pendiente</option>
              <option value="no-validado">No validado</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Zona</label>
            <input class="form-input" type="text" id="filtroZona" placeholder="Nombre de zona...">
          </div>
          <button class="btn btn-primary btn-full" id="btnAplicarFiltros">Aplicar filtros</button>
        </aside>

        <div class="historial-main">
          <div class="card">
            <table class="historial-table">
              <thead>
                <tr><th></th><th>Especie</th><th>Zona</th><th>Fecha</th><th>Estado</th></tr>
              </thead>
              <tbody id="historialTableBody"></tbody>
            </table>
            <p class="historial-empty" id="historialEmpty" style="display:none;">Aún no tienes avistamientos registrados. <a href="registrar.html">Registra tu primero</a>.</p>
            <p class="historial-empty" id="historialSinResultados" style="display:none;">Ningún avistamiento coincide con los filtros aplicados.</p>
          </div>

          <div class="card mt-6">
            <h3 class="card__title">Favoritos</h3>
            <div id="favoritosList" class="favoritos-list">
              <p class="favoritos-empty" id="favoritosEmpty">Aún no marcaste avistamientos como favoritos.</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/scripts/avistamientos-store.js?v=1" defer></script>
  <script src="assets/scripts/historial.js?v=4" defer></script>
</body>
</html>
